<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TC Barber | Barbearia</title>

<meta name="description" content="TC Barber - Seu estilo começa aqui. Agende seu horário.">

<style>

:root{
    --bg:#070707;
    --bg2:#0d0d0d;
    --card:#121212;
    --card2:#181818;
    --line:#292929;
    --gold:#d7a84b;
    --gold2:#f4d083;
    --white:#fff;
    --muted:#a7a7a7;
    --green:#25d366;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,#4a3715 0,#171107 20%,#070707 48%);
    color:var(--white);
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:linear-gradient(to bottom,black,transparent 75%);
}

.container{
    width:min(100%,620px);
    margin:auto;
    padding:18px 16px 45px;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:430px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    padding:45px 10px 35px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid #735a27;
    color:var(--gold2);
    background:#161107aa;
    border-radius:999px;
    padding:8px 16px;
    font-size:11px;
    font-weight:800;
    letter-spacing:2.5px;
    margin-bottom:22px;
    backdrop-filter:blur(8px);
}

.logo{
    font-size:clamp(42px,13vw,70px);
    font-weight:950;
    letter-spacing:5px;
    line-height:.95;
    text-shadow:0 8px 35px #000;
}

.logo span{
    color:var(--gold);
}

.hero-line{
    width:75px;
    height:3px;
    margin:22px auto 17px;
    border-radius:10px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.tagline{
    color:#d0d0d0;
    font-size:16px;
    letter-spacing:.3px;
    max-width:330px;
    line-height:1.5;
}

.hero-buttons{
    display:flex;
    gap:10px;
    width:100%;
    max-width:440px;
    margin-top:28px;
}

.hero-buttons a{
    flex:1;
}


/* =========================
   BOTÕES
========================= */

.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:52px;
    padding:15px 18px;
    border-radius:15px;
    font-weight:900;
    text-decoration:none;
    transition:.25s ease;
    cursor:pointer;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn-gold{
    color:#151006;
    background:linear-gradient(135deg,var(--gold2),var(--gold));
    box-shadow:0 12px 30px #d7a84b25;
}

.btn-dark{
    color:#fff;
    border:1px solid #383838;
    background:#151515;
}


/* =========================
   CARDS
========================= */

.card{
    background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    border:1px solid var(--line);
    border-radius:24px;
    padding:24px;
    margin:16px 0;
    box-shadow:0 18px 50px #0008;
    backdrop-filter:blur(10px);
    animation:appear .6s ease both;
}

.card h2{
    font-size:21px;
    margin-bottom:7px;
}

.section-sub{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    margin-bottom:16px;
}


/* =========================
   DESTAQUES
========================= */

.highlight{
    display:grid;
    grid-template-columns:1fr 1fr;
