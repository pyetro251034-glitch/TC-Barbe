<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TC Barber | Barbearia</title>

<meta name="description" content="TC Barber - Cortes, barba e atendimento a domicílio. Agende seu horário.">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: #fff;
    overflow-x: hidden;
}

/* =========================
   FUNDO
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;

    background:
        linear-gradient(
            rgba(0,0,0,0.78),
            rgba(0,0,0,0.94)
        ),
        radial-gradient(
            circle at 20% 20%,
            rgba(180,0,0,0.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 30%,
            rgba(0,60,180,0.22),
            transparent 30%
        ),
        linear-gradient(135deg,#080808,#111,#030303);
}

/* textura */

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    opacity: .16;
    pointer-events: none;

    background-image:
        linear-gradient(
            135deg,
            rgba(255,255,255,.04) 25%,
            transparent 25%
        ),
        linear-gradient(
            315deg,
            rgba(255,255,255,.025) 25%,
            transparent 25%
        );

    background-size: 70px 70px;
}

/* =========================
   NAVBAR
========================= */

header {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;

    background: rgba(0,0,0,.75);
    backdrop-filter: blur(14px);

    border-bottom: 1px solid rgba(212,175,55,.18);
}

.nav {
    max-width: 1150px;
    margin: auto;

    padding: 15px 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-weight: 900;
    letter-spacing: 2px;
}

/* mini logo */

.logo-mini {
    width: 43px;
    height: 43px;

    border-radius: 50%;

    border: 2px solid #d4af37;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #d4af37;

    font-weight: 900;
    font-size: 15px;

    box-shadow:
        0 0 18px rgba(212,175,55,.2);
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: #ddd;
    text-decoration: none;

    font-size: 13px;
    font-weight: bold;

    transition: .3s;
}

.nav-links a:hover {
    color: #d4af37;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 130px 20px 80px;

    position: relative;
}

/* luz atrás */

.hero::before {
    content: "";

    position: absolute;

    width: 600px;
    height: 600px;

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.13),
            transparent 65%
        );

    pointer-events: none;
}

.hero-content {
    position: relative;
    max-width: 850px;
}

/* =========================
   LOGO PRINCIPAL
========================= */

.main-logo {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    margin-bottom: 28px;
}

.letter {
    font-size: clamp(75px, 15vw, 145px);

    font-weight: 900;

    line-height: .8;

    color: #f3f3f3;

    text-shadow:
        0 0 30px rgba(255,255,255,.05);
}

/* lâmpada entre T e C */

.barber-pole {
    width: 43px;
    height: 125px;

    border-radius: 25px;

    position: relative;

    overflow: hidden;

    background:
        repeating-linear-gradient(
            -45deg,
            #e8e8e8 0px,
            #e8e8e8 11px,
            #c90000 11px,
            #c90000 22px,
            #e8e8e8 22px,
            #e8e8e8 33px,
            #123e9c 33px,
            #123e9c 44px
        );

    border: 3px solid #d4af37;

    box-shadow:
        0 0 20px rgba(212,175,55,.3),
        0 0 35px rgba(200,0,0,.15);
}

/* tampas da lâmpada */

.barber-pole::before,
.barber-pole::after {
    content: "";

    position: absolute;

    left: 50%;
    transform: translateX(-50%);

    width: 56px;
    height: 13px;

    background: #111;

    border: 2px solid #d4af37;

    border-radius: 8px;
}

.barber-pole::before {
    top: -5px;
}

.barber-pole::after {
    bottom: -5px;
}

.subtitle {
    color: #d4af37;

    font-size: 13px;

    letter-spacing: 5px;

    font-weight: bold;

    margin-bottom: 22px;
}

.hero h1 {
    font-size: clamp(36px, 7vw, 70px);

    line-height: 1;

    margin-bottom: 20px;

    text-transform: uppercase;
}

.hero h1 span {
    color: #d4af37;
}
