<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TC Barber | Barbearia</title>

    <meta name="description" content="TC Barber - Cortes, barba e sobrancelha. Agende seu horário pelo WhatsApp.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* TOPO */
        header {
            text-align: center;
            padding: 45px 20px 30px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d7a84b, #f4d083);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(215, 168, 75, 0.25);
        }

        header h1 {
            color: #d7a84b;
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            color: #bdbdbd;
            font-size: 16px;
        }

        /* BOTÃO WHATSAPP */
        .whatsapp {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 25px auto;
            padding: 16px 20px;
            border-radius: 12px;
            background: #25d366;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            transition: 0.2s;
        }

        .whatsapp:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* TÍTULOS */
        .section-title {
            text-align: center;
            color: #d7a84b;
            font-size: 27px;
            margin: 45px 0 20px;
        }

        /* SERVIÇOS */
        .services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .service {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 22px 15px;
            text-align: center;
        }

        .service h3 {
            color: white;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .price {
            color: #d7a84b;
            font-size: 23px;
            font-weight: bold;
        }

        /* DOMICÍLIO */
        .home-service {
            margin-top: 30px;
            padding: 25px 20px;
            background: #151515;
            border: 1px solid #d7a84b;
            border-radius: 14px;
            text-align: center;
        }

        .home-service h2 {
            color: #d7a84b;
            margin-bottom: 10px;
        }

        .home-service p {
            color: #cfcfcf;
            line-height: 1.6;
        }

        .no-fee {
            color: #25d366;
            font-weight: bold;
            margin-top: 8px;
        }

        /* INFORMAÇÕES */
        .info {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 25px;
            margin-top: 30px;
        }

        .info p {
            color: #d0d0d0;
            margin: 12px 0;
            line-height: 1.5;
        }

        .info strong {
            color: #d7a84b;
        }

        /* INSTAGRAM */
        .instagram {
            display: block;
            text-align: center;
            color: #d7a84b;
            text-decoration: none;
            font-weight: bold;
            margin: 25px 0;
            font-size: 17px;
        }

        /* RODAPÉ */
        footer {
            text-align: center;
            padding: 35px 20px;
            color: #777;
            font-size: 14px;
        }

        /* CELULAR */
        @media (max-width: 600px) {
            header h1 {
                font-size: 32px;
            }

            .services {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">TC</div>

        <h1>TC BARBER</h1>

        <p>Seu estilo, nossa arte.</p>
        <p>Cortes na régua & acabamento.</p>
    </header>
